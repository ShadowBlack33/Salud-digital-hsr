# Levanta el servidor HAPI FHIR R4 con backend PostgreSQL.
#   docker compose up -d
#   Servidor FHIR: http://localhost:8080/fhir
services:
  fhir-db:
    image: postgres:16-alpine
    container_name: hsr-fhir-db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${FHIR_DB_PASSWORD:-cambiar_en_produccion}
    volumes:
      - fhir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi"]
      interval: 10s
      retries: 5

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: hsr-hapi-fhir
    depends_on:
      fhir-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      spring.datasource.url: jdbc:postgresql://fhir-db:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.password: ${FHIR_DB_PASSWORD:-cambiar_en_produccion}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_multiple_delete: "true"
      hapi.fhir.reuse_cached_search_results_millis: "0"

  # Servidor PACS (DICOM) para imágenes médicas. El navegador nunca lo toca
  # directamente -- solo la propia API le habla, por eso el puerto solo se
  # publica en 127.0.0.1 (nada más que para poder inspeccionarlo tú mismo
  # durante el desarrollo, igual que en el notebook de la Semana 8).
  orthanc:
    image: orthancteam/orthanc:25.5.1
    container_name: hsr-orthanc
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "Hospital San Rafael - PACS"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"api": "${ORTHANC_PASSWORD:-orthanc_dev_2026}"}
    ports:
      - "127.0.0.1:8042:8042"
    volumes:
      - orthanc_data:/var/lib/orthanc/db

  # Frontend en React, compilado y servido por nginx.
  # OJO: la API corre con uvicorn directo en tu máquina (no está en Docker),
  # así que el contenedor no la alcanza como "localhost" -- eso, dentro de
  # un contenedor, se refiere al contenedor mismo, no a tu PC. Se usa
  # host.docker.internal, el nombre especial que Docker Desktop resuelve
  # hacia la máquina anfitriona.
  front:
    build:
      context: ./front
      args:
        VITE_API_BASE: http://localhost:8000
    container_name: hsr-front
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  fhir_pgdata:
  orthanc_data:
