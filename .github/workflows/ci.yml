# Revisión automática en cada pull request y en cada push a main.
# Si algo de esto falla, el PR no debería unirse: así nadie rompe main
# en la semana de entrega.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  front:
    name: Front (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build
        env:
          VITE_API_BASE: /api

  backend:
    name: API (pruebas end-to-end)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hsanrafael
          POSTGRES_USER: hsr
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hsr -d hsanrafael"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://hsr:ci@localhost:5432/hsanrafael
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Claves de prueba (se generan en cada corrida, nunca se guardan)
        run: |
          gen() { python -c "import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"; }
          echo "JWT_SECRET_KEY=$(gen)" >> "$GITHUB_ENV"
          echo "APP_ENCRYPTION_KEY=$(gen)" >> "$GITHUB_ENV"
          echo "APP_BLIND_INDEX_KEY=$(gen)" >> "$GITHUB_ENV"
      - name: Esquema, catálogos y datos sintéticos
        run: |
          P="psql -h localhost -U hsr -d hsanrafael -v ON_ERROR_STOP=1 -q"
          $P -f db/01_schema.sql
          $P -f db/02_seed_catalogos.sql
          python scripts/generar_datos.py --meses 1 --pacientes 200 --salida /tmp/03.sql
          $P -f /tmp/03.sql
          for f in db/04_*.sql db/06_*.sql db/07_*.sql db/08_*.sql db/09_*.sql db/10_*.sql db/11_*.sql; do $P -f "$f"; done
      - run: python scripts/test_e2e.py
