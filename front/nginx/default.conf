server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, recargar la página en cualquier vista de React que no sea
    # la raíz (ej. si más adelante agregan rutas con react-router) daría 404,
    # porque esa ruta no existe como archivo -- nginx no sabe que el
    # enrutamiento lo maneja JavaScript, no el servidor.
    location / {
        try_files $uri /index.html;
    }
}
