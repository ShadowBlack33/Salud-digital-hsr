# nginx del front: un solo origen público para todo el sistema.
#
#   /            el front (React compilado)
#   /api/...     la API FastAPI (se quita el prefijo /api)
#   /api/eventos el canal en vivo (SSE), sin buffer
#   /fhir/...    el servidor HAPI FHIR
#
# El túnel de Cloudflare apunta aquí. Como front, API y canal comparten
# origen, el navegador no necesita CORS (R03) y el SSE llega sin retrasos (R17).
#
# Este archivo se incluye dentro del bloque http de nginx (conf.d), por eso
# los map y limit_req_zone pueden ir fuera del server.

# IP real del cliente. Detrás del túnel todas las conexiones llegan desde
# cloudflared; Cloudflare manda la IP original en CF-Connecting-IP.
map $http_cf_connecting_ip $ip_cliente {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Limitación de tasa (R03): 10 peticiones por segundo por cliente, con una
# ráfaga de 30 que se atiende sin espera. Una ráfaga mayor recibe 429.
limit_req_zone $ip_cliente zone=api:10m rate=10r/s;
# Login más estricto (fuerza bruta): 30 por minuto por cliente. Holgado para
# el tester, que inicia sesión con varios roles seguidos; el bloqueo de la
# cuenta a los 3 intentos (R02) es la otra barrera.
limit_req_zone $ip_cliente zone=login:10m rate=30r/m;
limit_req_status 429;

# El canal en vivo lleva el token en la URL: se registra sin la query string.
log_format sin_query '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;   # el PACS acepta imágenes de hasta 15 MB

    # ---------------------------------------------------------------- API
    # Canal en vivo: debe ir ANTES de /api/ (gana el prefijo más largo).
    location /api/eventos/ {
        access_log /var/log/nginx/access.log sin_query;
        proxy_pass http://api:8000/eventos/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # sin esto, el túnel retiene los eventos
        proxy_cache off;
        proxy_read_timeout 3600s;     # la conexión queda abierta mucho tiempo
    }

    # El receptor del rest-hook de HAPI (R21) solo se alcanza por la red interna
    # de Docker (http://api:8000/fhir-hook/...). Desde afuera no existe.
    location ^~ /api/fhir-hook/ {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=30 nodelay;
        proxy_pass http://api:8000/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # el análisis de IA puede tardar
    }

    # Servidor FHIR expuesto. HAPI no tiene autenticación propia y guarda
    # datos del paciente, así que cada petición pasa antes por la puerta de la
    # API (app/api/puerta_fhir.py):
    #   POST /fhir/Observation y GET /fhir/metadata ... públicos (R21, tester)
    #   lecturas ...................................... token con fhir:read
    #   otras escrituras .............................. token con fhir:sync
    #   DELETE ........................................ nunca
    location /fhir/ {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 256k;    # una Observation pesa unos pocos KB
        auth_request /_puerta_fhir;
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /_puerta_fhir {
        internal;
        proxy_pass http://api:8000/interno/puerta-fhir;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
    }

    # ---------------------------------------------------------------- front
    # Cabeceras de seguridad (R03) en seguridad.conf. La API pone las suyas.

    # Las rutas (/login, /app, /app/pacientes/...) las maneja React, no existen
    # como archivos: sin esto, recargar la página en ellas daría 404.
    location / {
        include /etc/nginx/seguridad.conf;
        try_files $uri /index.html;
    }

    # Los archivos de /assets llevan el hash en el nombre: se pueden cachear siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/seguridad.conf;
        try_files $uri =404;
    }

    # El index.html nunca se cachea, para que una versión nueva se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/seguridad.conf;
    }
}
