# Cabeceras de seguridad para todo lo que sirve nginx directamente (R03).
# Se incluye en cada location del front porque un add_header dentro de una
# location anula los que vengan del nivel server.
#
# CSP: el front no carga nada de terceros (fuentes, scripts y estilos van en
# el propio build). style-src-attr permite los style="..." de React (anillos
# de progreso), sin abrir <style> o <script> en línea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# El túnel sirve por HTTPS: el navegador recuerda usar siempre HTTPS (por HTTP se ignora).
add_header Strict-Transport-Security "max-age=31536000" always;
